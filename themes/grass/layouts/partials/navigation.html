<nav class="navbar navbar-expand-lg bg-body-light navbar-dark">
    <div class="container-fluid">
    <a class="navbar-brand" href="{{.Site.BaseURL}}">
        <img class="grass-icon" title="GRASS" alt="GRASS logo in white variant without text" src="{{.Site.BaseURL}}images/logos/grass-logo-simple/grass-white-no-text.svg">
        <span class="grass text-white">{{.Site.Params.logo}}</span>
    </a>
    <button
        aria-controls="navigation"
        aria-expanded="false"
        aria-label="Toggle navigation"
        class="navbar-toggler border-0"
        data-bs-target="#navigation"
        data-bs-toggle="collapse"
        type="button">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse text-center" id="navigation">
        <ul class="navbar-nav">
            {{ range .Site.Menus.main }}
            {{- if .HasChildren }}
            <li class="nav-item dropdown">
                <a
                    aria-expanded="false"
                    aria-haspopup="true"
                    class="nav-link dropdown-toggle text-light"
                    data-bs-toggle="dropdown"
                    href="{{.URL}}"
                    id="dropdown-{{ .Name | urlize }}"
                    role="button">{{ .Name }}
                </a>
                <div class="dropdown-menu" role="menu" aria-labelledby="dropdown-{{ .Name | urlize }}">
                    {{ range .Children }}
                    <a class="dropdown-item" role="menuitem" href="{{.URL}}">{{.Name}}</a>
                    {{ end }}
                </div>
            </li>
            {{- else }}
            <li class="nav-item"><a class="nav-link text-light" href="{{.URL}}">{{ .Name }}</a></li>
            {{- end }}
            {{ end }}
        </ul>
        <div class="d-flex align-items-center ms-lg-3">
            <button class="btn btn-link nav-link px-0 text-light" id="theme-toggle" type="button" aria-label="Toggle theme">
                <i class="fas fa-adjust"></i>
            </button>
        </div>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const getStoredTheme = () => localStorage.getItem('theme')
                const setStoredTheme = theme => localStorage.setItem('theme', theme)
                const getPreferredTheme = () => {
                    const storedTheme = getStoredTheme()
                    if (storedTheme) {
                        return storedTheme
                    }
                    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
                }
                const setTheme = theme => {
                    if (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        document.documentElement.setAttribute('data-bs-theme', 'dark')
                    } else {
                        document.documentElement.setAttribute('data-bs-theme', theme)
                    }
                }
                const showActiveTheme = (theme) => {
                    const btn = document.querySelector('#theme-toggle i')
                    if (!btn) return
                    if (theme === 'dark') {
                        btn.className = 'fas fa-sun'
                    } else {
                        btn.className = 'fas fa-moon'
                    }
                }
                
                showActiveTheme(getPreferredTheme())
                
                document.getElementById('theme-toggle')?.addEventListener('click', () => {
                    const current = document.documentElement.getAttribute('data-bs-theme')
                    const next = current === 'dark' ? 'light' : 'dark'
                    setStoredTheme(next)
                    setTheme(next)
                    showActiveTheme(next)
                })
            })
        </script>

    </div>
    </div>
</nav>
