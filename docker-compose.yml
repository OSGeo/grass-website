---
services:
  build:
    # Official Hugo image (Extended, Dart Sass, Go, Node.js, Git). Renovate
    # manages this tag; keep it in sync with .devcontainer/devcontainer.json
    # and .github/workflows/.
    image: ghcr.io/gohugoio/hugo:v0.169.0
    # Root, as before, so the bind-mounted checkout is writable on any host.
    user: root
    environment:
      - HUGO_ENVIRONMENT=production
      - HUGO_ENV=production
    working_dir: /src
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        node -v
        && npm ci
        && hugo --minify --baseURL "http://localhost:8080/"
        && chmod -R a+rX public
    volumes:
      - ./:/src
      - ~/hugo_cache:/cache

  nginx:
    image: nginx:1.31.6
    command: ["nginx", "-g", "daemon off;"]
    depends_on:
      build:
        condition: service_completed_successfully
    ports:
      - 8080:80
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
