---
services:
  hugo-dev:
    # Official Hugo image (Extended, Dart Sass, Go, Node.js, Git). Renovate
    # manages this tag; keep it in sync with .devcontainer/devcontainer.json
    # and .github/workflows/.
    image: ghcr.io/gohugoio/hugo:v0.169.0
    # Root, as before, so the bind-mounted checkout is writable on any host.
    user: root
    environment:
      - HUGO_ENVIRONMENT=development
      - HUGO_ENV=development
    working_dir: /src
    ports:
      - "1313:1313"
    volumes:
      - ./:/src:delegated
      - hugo_cache:/cache
      - hugo_node_modules:/src/node_modules
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        node -v
        && npm ci
        && hugo server --bind 0.0.0.0 --port 1313
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  hugo_cache:
    driver: local
  hugo_node_modules:
    driver: local
